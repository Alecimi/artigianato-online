<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Catalogo Prodotti</title>
</head>
<body>
  <h1>Catalogo Prodotti</h1>
  <ul id="lista-prodotti"></ul>

  <script>
    fetch('http://localhost:3000/api/prodotti')
      .then(res => res.json())
      .then(data => {
        const ul = document.getElementById('lista-prodotti');
        data.forEach(prod => {
          const li = document.createElement('li');
          li.textContent = `${prod.nome} - €${prod.prezzo}`;
          ul.appendChild(li);
        });
      })
      .catch(err => {
        console.error('Errore caricamento prodotti', err);
      });
  </script>
</body>
</html>
