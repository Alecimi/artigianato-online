<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrazione - Artigianato Online</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container mt-5" style="max-width: 400px;">
    <h2>Registrazione</h2>
    <form id="registerForm">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" required />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required />
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Conferma Password</label>
        <input type="password" class="form-control" id="confirmPassword" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Registrati come:</label><br/>
        <input type="radio" id="cliente" name="role" value="cliente" checked />
        <label for="cliente">Cliente</label>
        <input type="radio" id="artigiano" name="role" value="artigiano" class="ms-3" />
        <label for="artigiano">Artigiano</label>
      </div>
      <button type="submit" class="btn btn-success">Registrati</button>
      <p class="mt-3">Hai già un account? <a href="login.html">Accedi qui</a></p>
    </form>

    <div id="message" class="mt-3"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $("#registerForm").submit(function(e) {
      e.preventDefault();

      if ($("#password").val() !== $("#confirmPassword").val()) {
        $("#message").text("Le password non coincidono").removeClass().addClass("alert alert-danger");
        return;
      }

      const data = {
        nome: $("#nome").val(),
        email: $("#email").val(),
        password: $("#password").val(),
        role: $("input[name='role']:checked").val()
      };

      $.ajax({
        url: "/register",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(data),
        success: function(res) {
          $("#message").text("Registrazione riuscita! Puoi ora effettuare il login.").removeClass().addClass("alert alert-success");
          $("#registerForm")[0].reset();
        },
        error: function(xhr) {
          $("#message").text("Errore: " + xhr.responseJSON?.message || "Registrazione fallita").removeClass().addClass("alert alert-danger");
        }
      });
    });
  </script>
</body>
</html>
