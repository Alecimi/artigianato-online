<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Artigiano - Artigianato</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../src/css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="container mt-4">
    <h2>Dashboard Artigiano</h2>
    <p>Qui puoi gestire i tuoi prodotti.</p>

    <form id="product-form" class="mb-4 w-50">
      <h4>Aggiungi Nuovo Prodotto</h4>
      <div class="mb-3">
        <label for="nome" class="form-label">Nome Prodotto:</label>
        <input type="text" id="nome" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="descrizione" class="form-label">Descrizione:</label>
        <textarea id="descrizione" class="form-control" required></textarea>
      </div>
      <div class="mb-3">
        <label for="prezzo" class="form-label">Prezzo (€):</label>
        <input type="number" id="prezzo" class="form-control" step="0.01" min="0" required />
      </div>
      <div id="product-error" class="error-message"></div>
      <div id="product-success" class="success-message"></div>
      <button type="submit" class="btn btn-primary">Aggiungi Prodotto</button>
    </form>

    <h4>Lista Prodotti</h4>
    <div id="product-list"></div>
  </main>

  <footer class="mt-5">
    <p>&copy; 2025 Artigianato</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../src/js/products.js"></script>
  <script src="../src/js/ui.js"></script>
  <script>
    $(function () {
      $('#navbar').load('navbar.html', function () {
        if (!requireLogin()) window.location.href = 'login.html';
        else {
          const role = parseJwt(localStorage.getItem('token')).role;
          if (role !== 'artigiano') window.location.href = 'index.html';
        }
      });

      $('#product-form').submit(function (e) {
        e.preventDefault();
        const token = localStorage.getItem('token');
        const nome = $('#nome').val().trim();
        const descrizione = $('#descrizione').val().trim();
        const prezzo = parseFloat($('#prezzo').val());

        $.ajax({
          url: 'http://localhost:3000/api/products',
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token },
          contentType: 'application/json',
          data: JSON.stringify({ nome, descrizione, prezzo }),
          success: function (res) {
            $('#product-success').text('Prodotto aggiunto con successo');
            $('#product-error').text('');
            $('#product-form')[0].reset();
            loadProducts();
          },
          error: function (xhr) {
            $('#product-error').text(xhr.responseJSON?.error || 'Errore nell\'aggiunta prodotto');
            $('#product-success').text('');
          },
        });
      });
    });
  </script>
</body>
</html>
