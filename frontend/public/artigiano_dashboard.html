<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Artigiano</title>
</head>
<body>
    <script>
        const token = localStorage.getItem("token");
        if (!token) {
        window.location.href = "login.html";
        }

        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.role !== 'artigiano') {
        window.location.href = "login.html";
        }
    </script>
  <h1>Benvenuto Artigiano!</h1>
  <p>Qui potrai caricare e gestire i tuoi prodotti.</p>
</body>
</html>
