<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carrello - Artigianato</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../src/css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="container mt-4">
    <h2>Il Mio Carrello</h2>
    <div id="cart-items"></div>
    <div id="cart-total" class="mt-3 fw-bold"></div>
    <button id="checkout-btn" class="btn btn-success mt-3">Procedi all'acquisto</button>
  </main>

  <footer class="mt-5">
    <p>&copy; 2025 Artigianato</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../src/js/ui.js"></script>
  <script>
    $(function () {
      $('#navbar').load('navbar.html', function () {
        if (!requireLogin()) window.location.href = 'login.html';
      });

      // Carrello semplice in localStorage
      let cart = JSON.parse(localStorage.getItem('cart')) || [];

      function renderCart() {
        const container = $('#cart-items');
        container.empty();

        if (cart.length === 0) {
          container.html('<p>Il carrello è vuoto.</p>');
          $('#cart-total').text('');
          $('#checkout-btn').prop('disabled', true);
          return;
        }

        let total = 0;
        cart.forEach((item, idx) => {
          const subtotal = item.prezzo * item.quantita;
          total += subtotal;
          container.append(`
            <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
              <div>
                <strong>${item.nome}</strong><br />
                Prezzo: €${item.prezzo.toFixed(2)} x 
                <input type="number" class="cart-qty form-control d-inline-block" style="width: 60px;" min="1" value="${item.quantita}" data-index="${idx}" />
              </div>
              <div>
                Subtotale: €${subtotal.toFixed(2)}
                <button class="btn btn-sm btn-danger ms-3 remove-item" data-index="${idx}">Rimuovi</button>
              </div>
            </div>
          `);
        });

        $('#cart-total').text('Totale: €' + total.toFixed(2));
        $('#checkout-btn').prop('disabled', false);
      }

      renderCart();

      $(document).on('change', '.cart-qty', function () {
        const idx = $(this).data('index');
        let val = parseInt($(this).val());
        if (val < 1) val = 1;
        cart[idx].quantita = val;
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
      });

      $(document).on('click', '.remove-item', function () {
        const idx = $(this).data('index');
        cart.splice(idx, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
      });

      $('#checkout-btn').click(function () {
        if (cart.length === 0) return;

        const token = localStorage.getItem('token');
        if (!token) {
          alert('Devi essere loggato per effettuare un ordine.');
          window.location.href = 'login.html';
          return;
        }

        const ordineProdotti = cart.map((item) => ({
          prodotto_id: item.id,
          quantita: item.quantita,
        }));

        $.ajax({
          url: 'http://localhost:3000/api/orders',
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token },
          contentType: 'application/json',
          data: JSON.stringify({ prodotti: ordineProdotti }),
          success: function () {
            alert('Ordine effettuato con successo!');
            cart = [];
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
          },
          error: function (xhr) {
            alert(xhr.responseJSON?.error || 'Errore durante l\'ordine');
          },
        });
      });

    });
  </script>
</body>
</html>
