<script>
  const authLinks = document.getElementById('authLinks');
  const navLinks = document.getElementById('navLinks');

  const token = localStorage.getItem('token');
  if (token) {
    // Utente loggato
    const payload = JSON.parse(atob(token.split('.')[1]));

    // Aggiungo Profilo e Carrello
    const profiloLink = document.createElement('li');
    profiloLink.classList.add('nav-item');
    profiloLink.innerHTML = `<a class="nav-link" href="profilo.html">Profilo (${payload.nome})</a>`;
    navLinks.appendChild(profiloLink);

    if (payload.role === 'cliente') {
      const carrelloLink = document.createElement('li');
      carrelloLink.classList.add('nav-item');
      carrelloLink.innerHTML = `<a class="nav-link" href="carrello.html">Carrello</a>`;
      navLinks.appendChild(carrelloLink);
    } else if (payload.role === 'artigiano') {
      // Potresti aggiungere link specifici per artigiano qui se serve
    }

    // Aggiungo Logout
    const logoutLink = document.createElement('li');
    logoutLink.classList.add('nav-item');
    logoutLink.innerHTML = `<a class="nav-link" href="#" id="logoutBtn">Logout</a>`;
    authLinks.appendChild(logoutLink);

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'index.html';
    });

  } else {
    // Utente non loggato
    authLinks.innerHTML = `<li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>`;
  }
</script>
