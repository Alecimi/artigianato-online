<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Ordini Cliente</title>
</head>
<body>
  <h1>I tuoi ordini</h1>
  <ul id="lista-ordini"></ul>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      alert('Devi fare login');
      window.location.href = 'login.html';
    }

    fetch('http://localhost:3000/api/ordini', {
      headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(res => {
      if (res.status === 401 || res.status === 403) {
        alert('Accesso negato. Effettua il login.');
        window.location.href = 'login.html';
      }
      return res.json();
    })
    .then(data => {
      const ul = document.getElementById('lista-ordini');
      if(data.length === 0) ul.textContent = 'Nessun ordine effettuato.';
      else {
        data.forEach(ord => {
          const li = document.createElement('li');
          li.textContent = `Ordine #${ord.id} effettuato il ${new Date(ord.data).toLocaleString()}`;
          ul.appendChild(li);
        });
      }
    })
    .catch(err => console.error(err));
  </script>
</body>
</html>
