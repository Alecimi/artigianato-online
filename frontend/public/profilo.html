<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profilo - Artigianato</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../src/css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="container mt-4">
    <h2>Il Mio Profilo</h2>
    <div id="profile-info"></div>

    <h4 class="mt-4">I miei ordini</h4>
    <div id="orders-list"></div>
  </main>

  <footer class="mt-5">
    <p>&copy; 2025 Artigianato</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../src/js/orders.js"></script>
  <script src="../src/js/ui.js"></script>
  <script>
    $(function () {
      $('#navbar').load('navbar.html', function () {
        if (!requireLogin()) window.location.href = 'login.html';

        const token = localStorage.getItem('token');
        const payload = parseJwt(token);

        $.ajax({
          url: `http://localhost:3000/api/users/${payload.userId}`,
          method: 'GET',
          headers: { Authorization: 'Bearer ' + token },
          success: function (user) {
            $('#profile-info').html(`
              <p><strong>Nome:</strong> ${user.nome}</p>
              <p><strong>Email:</strong> ${user.email}</p>
              <p><strong>Ruolo:</strong> ${user.role}</p>
            `);
          },
          error: function () {
            $('#profile-info').html('<p>Errore nel caricamento del profilo.</p>');
          },
        });

        loadOrders();
      });
    });
  </script>
</body>
</html>
